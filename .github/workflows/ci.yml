name: CI — Warehouse & Iceberg Cubing Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDB Python engine
        run: |
          python -m pip install --upgrade pip
          pip install duckdb

      - name: Run unit & integration test suite
        run: python -m unittest discover -s tests -v

      - name: Execute full Star Schema OLAP & BUC/AOI pipeline
        run: python main.py --all
